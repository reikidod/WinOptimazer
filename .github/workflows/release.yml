name: Release

# Публикует релиз при пуше тега вида v0.3.2. Встроенное обновление приложения
# (Проверить обновления) берёт из релиза файл WinOptimizer-win-x64.zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish WinOptimizer.csproj -c Release -r win-x64 --self-contained false -o publish `
            -p:Version=$v -p:AssemblyVersion="$v.0" -p:FileVersion="$v.0"
          if (-not (Test-Path publish\WinOptimizer.exe)) { throw 'publish\WinOptimizer.exe не найден' }
          Compress-Archive -Path publish\* -DestinationPath WinOptimizer-win-x64.zip

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' WinOptimizer-win-x64.zip --title '${{ github.ref_name }}' --generate-notes
