name: Release

# Каждый пуш в main автоматически собирает приложение и публикует релиз с файлом
# WinOptimizer-win-x64.zip. Встроенное обновление приложения («Проверить обновления»
# и проверка при запуске) скачивает именно его — собирать проект вручную не нужно.
# Номер версии: major.minor из <Version> в WinOptimizer.csproj + номер запуска сборки.
on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content WinOptimizer.csproj
          $base = $proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          $p = $base.Split('.')
          $v = "$($p[0]).$($p[1]).${{ github.run_number }}"
          # main — стабильный канал, beta — бета-канал (релиз помечается prerelease и тегом -beta)
          $channel = if ($env:GITHUB_REF_NAME -eq 'beta') { 'beta' } else { 'stable' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Версия релиза: $v, канал: $channel"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось восстановить NuGet-зависимости' }

      - name: Build application
        shell: pwsh
        run: |
          dotnet build WinOptimizer.csproj -c Release --no-restore -p:Version=$env:VERSION -p:ReleaseChannel=$env:CHANNEL
          if ($LASTEXITCODE -ne 0) { throw 'Сборка приложения не прошла' }

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Тесты не прошли, релиз не публикуется' }

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish WinOptimizer.csproj -c Release -r win-x64 --self-contained false -o publish `
            -p:Version=$env:VERSION -p:AssemblyVersion="$env:VERSION.0" -p:FileVersion="$env:VERSION.0" `
            -p:PublishReadyToRun=true -p:ReleaseChannel=$env:CHANNEL
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish завершился с ошибкой' }
          if (-not (Test-Path publish\WinOptimizer.exe)) { throw 'publish\WinOptimizer.exe не найден' }
          Compress-Archive -Path publish\* -DestinationPath WinOptimizer-win-x64.zip

      - name: Installer (Inno Setup + .NET Desktop Runtime)
        shell: pwsh
        run: |
          # Runtime кладём внутрь установщика: на чистой Windows программа запустится без ручных зависимостей.
          New-Item -ItemType Directory -Force redist | Out-Null
          Invoke-WebRequest -Uri 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe' -OutFile redist\windowsdesktop-runtime-win-x64.exe
          if ((Get-Item redist\windowsdesktop-runtime-win-x64.exe).Length -lt 40MB) { throw 'Runtime скачан некорректно' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if (-not (Test-Path $iscc)) { throw 'Inno Setup не найден' }
          }
          & $iscc "/DMyAppVersion=$env:VERSION" installer\WinOptimizer.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC завершился с ошибкой' }
          if (-not (Test-Path dist\WinOptimizer-Setup.exe)) { throw 'dist\WinOptimizer-Setup.exe не найден' }

      - name: Installer smoke test (тихая установка и удаление)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'wo-install'
          $p = Start-Process dist\WinOptimizer-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NORELAUNCH=1 /DIR=`"$dir`" /LOG=`"$env:RUNNER_TEMP\setup.log`"" -Wait -PassThru
          if (Test-Path "$env:RUNNER_TEMP\setup.log") { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 25 }
          if ($p.ExitCode -ne 0) { throw "Установщик завершился с кодом $($p.ExitCode)" }
          if (-not (Test-Path "$dir\WinOptimizer.exe")) { throw 'После установки нет WinOptimizer.exe' }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Удаление завершилось с кодом $($u.ExitCode)" }

      - name: Smoke test (запуск собранного приложения)
        shell: pwsh
        run: |
          # Распаковываем архив ровно так, как это делает обновление, и запускаем приложение.
          Expand-Archive WinOptimizer-win-x64.zip -DestinationPath smoke -Force
          $log = Join-Path $env:ProgramData 'WinOptimizer\log.txt'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process (Resolve-Path smoke\WinOptimizer.exe) -PassThru
          Start-Sleep -Seconds 15
          $exited = $p.HasExited
          $text = if (Test-Path $log) { Get-Content $log -Raw -Encoding UTF8 } else { '' }
          Write-Host "---- log ----"; Write-Host $text
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          if ($exited) { throw "Приложение закрылось сразу после запуска, код $($p.ExitCode)" }
          if ($text -match 'XamlParseException|TypeInitializationException|Необработанное исключение|Критическая ошибка') {
            throw 'При запуске в логе есть критические ошибки'
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $header = "## $($env:VERSION) Beta"
          $pattern = "(?ms)^" + [regex]::Escape($header) + "[^\r\n]*\r?\n(.*?)(?=^## |\z)"
          $match = [regex]::Match($changelog, $pattern)
          if ($match.Success) {
            $match.Groups[1].Value.Trim() | Set-Content -Path notes.md -Encoding utf8
          } else {
            git log -1 --pretty=%B | Out-File -FilePath notes.md -Encoding utf8
          }
          if ($env:CHANNEL -eq 'beta') {
            $tag = "v$env:VERSION-beta"
            gh release create $tag WinOptimizer-win-x64.zip dist\WinOptimizer-Setup.exe --target ${{ github.sha }} --title "$tag (бета)" --notes-file notes.md --prerelease
          } else {
            $tag = "v$env:VERSION"
            gh release create $tag WinOptimizer-win-x64.zip dist\WinOptimizer-Setup.exe --target ${{ github.sha }} --title $tag --notes-file notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось создать релиз' }
