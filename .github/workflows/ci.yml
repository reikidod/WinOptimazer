name: CI

on:
  pull_request:
    branches: [beta]
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Pair validation — build and tests"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore tests and application
        run: dotnet restore tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj

      - name: Build application
        run: dotnet build WinOptimizer.csproj --configuration Release --no-restore

      - name: Run tests and save detailed report
        run: dotnet test tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal" --logger "trx;LogFileName=winoptimizer-tests.trx"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: tests/WinOptimizer.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
