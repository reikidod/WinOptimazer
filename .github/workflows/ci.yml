name: WinOptimizer Application CI

on:
  pull_request:
    branches: [beta]
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winoptimizer-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows x64 — restore, build, tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore application and tests
        shell: pwsh
        run: |
          dotnet restore WinOptimizer.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось восстановить приложение' }
          dotnet restore tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось восстановить тесты' }

      - name: Build WinOptimizer (Release, x64)
        shell: pwsh
        run: |
          dotnet build WinOptimizer.csproj --configuration Release --no-restore -p:ReleaseChannel=beta
          if ($LASTEXITCODE -ne 0) { throw 'Сборка WinOptimizer завершилась с ошибкой' }
          if (-not (Test-Path 'bin/Release/net8.0-windows/WinOptimizer.exe')) {
            throw 'После сборки не найден WinOptimizer.exe'
          }

      - name: Run regression tests
        shell: pwsh
        run: |
          dotnet test tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal" --logger "trx;LogFileName=winoptimizer-tests.trx"
          if ($LASTEXITCODE -ne 0) { throw 'Регрессионные тесты не прошли' }

      - name: Upload application build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WinOptimizer-beta-build-${{ github.run_number }}
          path: bin/Release/net8.0-windows/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinOptimizer-beta-tests-${{ github.run_number }}
          path: tests/WinOptimizer.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
