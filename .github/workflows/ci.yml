name: WinOptimizer Application CI

on:
  pull_request:
    branches: [beta]
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winoptimizer-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  themes:
    name: Themes — palette, tokens, structure
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore tests
        shell: pwsh
        run: |
          dotnet restore tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось восстановить тесты' }

      - name: Validate DarkTheme Signal tokens
        shell: pwsh
        run: |
          $theme = Get-Content -Raw Themes/DarkTheme.xaml
          $pairs = @(
            @('BgWindowColor', '#101418'),
            @('BgSidebarColor', '#151A1F'),
            @('BgCardColor', '#1A2127'),
            @('AccentColor', '#00C58E'),
            @('AccentStrongColor', '#00A577')
          )
          foreach ($pair in $pairs) {
            $key, $value = $pair[0], $pair[1]
            if ($theme -notlike "*$key*$value*") {
              throw "DarkTheme.xaml: ожидается $key = $value"
            }
            Write-Host "OK $key = $value"
          }
          foreach ($style in @('AccentButton', 'NavButton')) {
            if ($theme -notlike "*x:Key=`"$style`"*") {
              throw "DarkTheme.xaml: отсутствует Style $style"
            }
            Write-Host "OK Style $style"
          }
          if ($theme -notlike '*TargetType="Button"*') {
            throw 'DarkTheme.xaml: отсутствует базовый Style Button'
          }
          if ($theme -notlike '*</ResourceDictionary>*') {
            throw 'DarkTheme.xaml: файл обрезан (нет закрывающего ResourceDictionary)'
          }
          $lines = (Get-Content Themes/DarkTheme.xaml).Count
          if ($lines -lt 200) {
            throw "DarkTheme.xaml слишком короткий ($lines строк) — возможна обрезка"
          }
          Write-Host "DarkTheme.xaml Signal tokens и стили в порядке ($lines строк)"

      - name: Validate ThemeManager aurora palette
        shell: pwsh
        run: |
          $src = Get-Content -Raw dll/WinOptimizer.Settings/ThemeManager.cs
          if ($src -notmatch '#00C58E') { throw 'ThemeManager: акцент #00C58E не найден' }
          if ($src -notmatch '#101418') { throw 'ThemeManager: BgWindow #101418 не найден' }
          if ($src -notmatch 'Control Center \(Signal\)') { throw 'ThemeManager: имя темы Signal не найдено' }
          Write-Host 'ThemeManager aurora/Signal палитра в порядке'

      - name: Guard UiStructureTests is complete
        shell: pwsh
        run: |
          $path = 'tests/WinOptimizer.Tests/UiStructureTests.cs'
          $lines = (Get-Content $path).Count
          $text = Get-Content -Raw $path
          if ($lines -lt 200) {
            throw "UiStructureTests.cs обрезан ($lines строк). Восстановите полный файл (см. commit 69cc17a) и обновите цвета Signal."
          }
          if ($text -like '*PLACEHOLDER*' -or $text -like '*Remainder of file must be restored*') {
            throw 'UiStructureTests.cs содержит заглушку — восстановите полный файл'
          }
          if ($text -notlike '*#101418*' -or $text -notlike '*#00C58E*') {
            throw 'UiStructureTests.cs: ожидаются Signal-цвета #101418 / #00C58E в ассертах'
          }
          Write-Host "UiStructureTests.cs OK ($lines строк)"

      - name: Run theme unit tests
        shell: pwsh
        run: |
          dotnet test tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj `
            --configuration Release `
            --filter "FullyQualifiedName~ThemePaletteTests|FullyQualifiedName~UiStructureTests" `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=theme-tests.trx"
          if ($LASTEXITCODE -ne 0) { throw 'Тесты тем не прошли' }

      - name: Upload theme test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinOptimizer-theme-tests-${{ github.run_number }}
          path: tests/WinOptimizer.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  build-and-test:
    name: Windows x64 — restore, build, tests
    runs-on: windows-latest
    needs: themes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore application and tests
        shell: pwsh
        run: |
          dotnet restore WinOptimizer.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось восстановить приложение' }
          dotnet restore tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось восстановить тесты' }

      - name: Build WinOptimizer (Release, x64)
        shell: pwsh
        run: |
          dotnet build WinOptimizer.csproj --configuration Release --no-restore -p:ReleaseChannel=beta
          if ($LASTEXITCODE -ne 0) { throw 'Сборка WinOptimizer завершилась с ошибкой' }
          $appHost = 'bin/Release/net8.0-windows/win-x64/WinOptimizer.exe'
          if (-not (Test-Path $appHost)) {
            throw "После сборки не найден WinOptimizer.exe по ожидаемому пути $appHost"
          }

      - name: Run regression tests
        shell: pwsh
        run: |
          dotnet test tests/WinOptimizer.Tests/WinOptimizer.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal" --logger "trx;LogFileName=winoptimizer-tests.trx"
          if ($LASTEXITCODE -ne 0) { throw 'Регрессионные тесты не прошли' }

      - name: Verify no tests were skipped
        shell: pwsh
        run: |
          $trx = Get-ChildItem tests/WinOptimizer.Tests/TestResults -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { throw 'Не найден отчёт тестов (.trx)' }
          [xml]$report = Get-Content $trx.FullName
          $c = $report.TestRun.ResultSummary.Counters
          Write-Host "Всего: $($c.total); выполнено: $($c.executed); успешно: $($c.passed); упало: $($c.failed); не выполнено: $($c.notExecuted)"
          if ([int]$c.total -eq 0) { throw 'Тесты не запускались' }
          if ([int]$c.failed -ne 0 -or [int]$c.notExecuted -ne 0 -or [int]$c.executed -ne [int]$c.total -or [int]$c.passed -ne [int]$c.total) {
            throw 'Часть тестов упала или была пропущена'
          }

      - name: Upload application build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WinOptimizer-beta-build-${{ github.run_number }}
          path: bin/Release/net8.0-windows/win-x64/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinOptimizer-beta-tests-${{ github.run_number }}
          path: tests/WinOptimizer.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
