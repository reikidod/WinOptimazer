<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="WinOptimizer — центр управления Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0E"/>
      <stop offset="1" stop-color="#1B1013"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FF5A5F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF5A5F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A5F"/>
      <stop offset="1" stop-color="#C0262D"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Знак: скруглённый квадрат с «ползунками» настроек -->
  <g transform="translate(84 92)">
    <rect width="136" height="136" rx="34" fill="url(#accent)"/>
    <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
      <path d="M34 48H102" stroke-opacity="0.55"/>
      <path d="M34 68H102" stroke-opacity="0.55"/>
      <path d="M34 88H102" stroke-opacity="0.55"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="80" cy="48" r="11"/>
      <circle cx="54" cy="68" r="11"/>
      <circle cx="86" cy="88" r="11"/>
    </g>
  </g>

  <g font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
    <text x="260" y="146" font-size="64" font-weight="700" fill="#F2F3F5" letter-spacing="-1">WinOptimizer</text>
    <text x="262" y="188" font-size="24" fill="#C2CCDA">Единый центр управления Windows 10/11</text>

    <g font-size="15" font-weight="600">
      <g transform="translate(262 216)">
        <rect width="190" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="95" y="24" text-anchor="middle" fill="#F2F3F5">Откат любых твиков</text>
      </g>
      <g transform="translate(466 216)">
        <rect width="222" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="111" y="24" text-anchor="middle" fill="#F2F3F5">Точки восстановления</text>
      </g>
      <g transform="translate(702 216)">
        <rect width="168" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="84" y="24" text-anchor="middle" fill="#F2F3F5">Открытый код</text>
      </g>
    </g>
  </g>
</svg>
